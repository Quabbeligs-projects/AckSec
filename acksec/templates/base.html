<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} – AckSec</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/acksec.css') }}">
</head>
<body>
  <a class="skip-link" href="#content">Zum Inhalt springen</a>

  <div class="util">
    <div class="wrap util-in">
      <span>Privatkunden</span>
      <span class="util-right">{% block util_right %}{% endblock %}</span>
    </div>
  </div>

  <header class="top">
    <div class="wrap top-in">
      <a class="logo" href="{{ url_for('public.index') }}">
        <span class="logo-mark" aria-hidden="true">A</span>
        <span class="logo-text">AckSec<small>Bank</small></span>
      </a>
      {# filled by the logged-in pages once login exists (UC2) #}
      {% block mainnav %}{% endblock %}
    </div>
  </header>

  <main id="content" class="wrap page">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <div class="wrap foot-in">
      <span>&copy; 2026 AckSec</span>
      <span class="foot-right">Fiktive Bank, Schulprojekt MNG Rämibühl. Es fliesst kein echtes Geld.</span>
    </div>
  </footer>
</body>
</html>
